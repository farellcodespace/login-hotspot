<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connecting</title>
<meta http-equiv="refresh" content="4; url=$(link-redirect)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="login.css" media="screen">
<script type="text/javascript">
function startClock() {
$(if popup == 'true')
	open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290');
$(endif)
	location.href = 'https://www.masawan.com',500;
}
</script>
</head>
<body class="page" onload="startClock()">
<main class="card">
	<div class="spinner" aria-hidden="true"></div>
	<h1 role="status">Connecting&hellip;</h1>
	<p class="sub">You will be redirected automatically.</p>
</main>
</body>
</html>
