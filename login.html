<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="-1" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="login.css" media="screen">
</head>
<body class="page">
$(if chap-id)
	<form name="sendin" action="$(link-login-only)" method="post">
		<input type="hidden" name="username" />
		<input type="hidden" name="password" />
		<input type="hidden" name="dst" value="$(link-orig)" />
		<input type="hidden" name="popup" value="true" />
	</form>

	<script type="text/javascript" src="/md5.js"></script>
	<script type="text/javascript">
	// <!--
	    function doLogin() {
		document.sendin.username.value = document.login.username.value;
		document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
		document.sendin.submit();
		return false;
	    }
	//-->
	</script>
$(endif)

<main class="card with-avatar">
	<img class="avatar" src="asset/user.jpeg" width="100" height="100" alt="">
	<form name="login" action="$(link-login-only)" method="post"
		$(if chap-id) onSubmit="return doLogin()" $(endif)>
		<input type="hidden" name="dst" value="$(link-orig)" />
		<input type="hidden" name="popup" value="true" />

		<!-- Judul: ganti "Wi-Fi Login" dengan nama jaringan atau sekolah -->
		<h1>Wi-Fi Login</h1>
		<p class="sub">Please enter your username and password.</p>

		$(if error)
		<p class="notice" role="alert">$(error)</p>
		$(endif)

		<label for="username">Username</label>
		<div class="field">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
			<input id="username" name="username" type="text" value="" autocomplete="on" autocapitalize="none" autocorrect="off" spellcheck="false" />
		</div>

		<label for="password">Password</label>
		<div class="field">
			<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
			<input id="password" name="password" type="password" autocomplete="off" />
		</div>

		<button type="submit">Connect</button>
	</form>
</main>

<script type="text/javascript">
// <!--
  document.login.username.focus();
  (function () {
    var tombol = document.login.querySelector('button');
    function reset() { tombol.disabled = false; tombol.textContent = 'Connect'; }
    document.login.addEventListener('submit', function () {
      tombol.disabled = true;
      tombol.textContent = 'Connecting…';
      setTimeout(reset, 10000);
    });
    window.addEventListener('pageshow', reset);
  })();
//-->
</script>
<script type="text/javascript">
document.oncontextmenu = function(){return false;}
</script>
</body>
</html>
