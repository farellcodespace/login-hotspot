<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logged out</title>
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="login.css" media="screen">
<script type="text/javascript">
<!--
    function openLogin() {
	if (window.name != 'hotspot_logout') return true;
	open('$(link-login)', '_blank', '');
	window.close();
	return false;
    }
//-->
</script>
</head>
<body class="page">
<main class="card">
	<h1>You have just logged out</h1>

	<dl class="info">
		<div><dt>User name</dt><dd>$(username)</dd></div>
		<div><dt>IP address</dt><dd>$(ip)</dd></div>
		<div><dt>MAC address</dt><dd>$(mac)</dd></div>
		<div><dt>Session time</dt><dd>$(uptime)</dd></div>
$(if session-time-left)
		<div><dt>Time left</dt><dd>$(session-time-left)</dd></div>
$(endif)
		<div><dt>Bytes up / down</dt><dd>$(bytes-in-nice) / $(bytes-out-nice)</dd></div>
	</dl>

	<form action="$(link-login)" name="login" onSubmit="return openLogin()">
		<button type="submit">Log in</button>
	</form>
</main>
</body>
</html>
